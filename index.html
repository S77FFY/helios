<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

<script>
const VERSION = '1.0.3';

const VS = `
attribute vec2 p;
varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }
`;

/* ---------------- SCENE: raymarched sculpture over a sunset ocean ---------------- */
const FS_SCENE = `
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform float uImp;
uniform vec3 uRo;
uniform vec3 uTa;
uniform vec3 uSun;
uniform float uNight;
#define SUN uSun
#define C vec3(0.0,1.35,0.0)
float gTh;
float gCore;

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++){ v+=a*noise(p); p=rot(0.5)*p*2.03+vec2(1.7,9.2); a*=0.5; }
  return v;
}

vec3 skyBase(vec3 rd){
  float y=rd.y, N=uNight;
  vec3 hor=mix(vec3(1.05,0.42,0.22),vec3(0.10,0.16,0.28),N);
  vec3 mid=mix(vec3(0.48,0.20,0.48),vec3(0.04,0.06,0.16),N);
  vec3 top=mix(vec3(0.03,0.04,0.16),vec3(0.005,0.008,0.03),N);
  vec3 c=mix(hor,mid,smoothstep(0.0,0.2,y));
  c=mix(c,top,smoothstep(0.15,0.75,y));
  c=mix(c,hor*0.55,1.0-smoothstep(-0.08,0.0,y));
  float s=max(dot(rd,SUN),0.0);
  c+=vec3(1.0,0.55,0.25)*pow(s,6.0)*0.55*(1.0-0.75*N);
  c+=vec3(1.0,0.72,0.42)*pow(s,48.0)*1.2*(1.0-0.75*N);
  c+=vec3(0.9,0.25,0.1)*pow(s,4.0)*N*0.45*(1.0-smoothstep(0.0,0.15,y));
  return c;
}
vec3 aurora(vec3 rd){
  if(rd.y<=0.0) return vec3(0.0);
  float az=atan(rd.x,-rd.z);
  vec3 c=vec3(0.0);
  for(int i=0;i<3;i++){
    float fi=float(i);
    float base=0.15+fi*0.09+0.06*sin(az*2.3+fi*1.7+uT*0.6)+0.04*noise(vec2(az*4.0+fi*3.1,uT*0.4));
    float d=rd.y-base;
    float curtain=smoothstep(-0.015,0.0,d)*exp(-max(d,0.0)*9.0);
    float rays=0.5+0.5*noise(vec2(az*38.0+fi*11.0,uT*0.8));
    rays=rays*rays;
    vec3 g=mix(vec3(0.1,1.0,0.5),vec3(0.8,0.2,1.0),clamp(d*6.0,0.0,1.0));
    c+=g*curtain*rays*(0.8-fi*0.2);
  }
  return c*smoothstep(0.0,0.08,rd.y);
}
vec3 sky(vec3 rd){
  vec3 c=skyBase(rd);
  float s=max(dot(rd,SUN),0.0);
  c+=vec3(1.0,0.92,0.8)*smoothstep(0.9993,0.9997,s)*10.0;
  if(rd.y>0.0){
    vec2 cp=rd.xz/(rd.y+0.08)*0.9+vec2(uT*0.06,uT*0.02);
    float n=fbm(cp);
    float cl=smoothstep(0.48,0.82,n)*smoothstep(0.0,0.12,rd.y)*(1.0-smoothstep(0.5,0.9,rd.y));
    vec3 cc=mix(vec3(0.30,0.14,0.28),vec3(1.5,0.7,0.35),pow(s,3.0));
    cc=mix(cc,vec3(0.03,0.04,0.08),uNight);
    c=mix(c,cc,cl*0.8);
    vec2 sp=floor(rd.xz/(rd.y+0.25)*140.0);
    float st=step(0.9975,hash(sp));
    c+=st*(smoothstep(0.3,0.7,rd.y)*0.8+uNight*smoothstep(0.05,0.3,rd.y)*1.5)*(1.0-cl*0.9);
    c+=aurora(rd)*uNight*1.4*(1.0-cl*0.6);
  }
  return c;
}

float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }

vec2 map(vec3 p){
  vec3 q=p-C;
  q.xz*=rot(uT*0.6);
  q.xy*=rot(0.4+uT*0.25);
  float sphR=1.0+0.6*smoothstep(8.6,9.5,uT);
  float sph=length(q)-sphR;
  float fq=4.6/sphR;
  float g=dot(sin(q*fq),cos(q.zxy*fq))*0.2*sphR;
  vec2 r=vec2(max(sph,abs(g)-gTh),1.0);
  float core=length(q)-0.3*clamp(gCore,0.0,1.3)-0.4*smoothstep(7.8,8.6,uT);
  if(core<r.x) r=vec2(core,2.0);
  float spin=3.0*smoothstep(6.5,9.5,uT);
  float rs=1.0+0.08*smoothstep(8.6,9.5,uT);
  vec3 a=q; a.xy*=rot(1.1); a.xz*=rot(uT*1.3+spin);
  vec3 b=q; b.yz*=rot(-0.9); b.xz*=rot(-uT*1.0-spin);
  float tr=min(sdTorus(a,vec2(1.55*rs,0.025)),sdTorus(b,vec2(1.85*rs,0.018)));
  if(tr<r.x) r=vec2(tr,3.0);
  return r;
}

vec3 calcN(vec3 p){
  vec2 e=vec2(0.0015,-0.0015);
  return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);
}
float calcAO(vec3 p, vec3 n){
  float o=0.0, s=1.0;
  for(int i=0;i<5;i++){ float h=0.02+0.08*float(i); float d=map(p+n*h).x; o+=(h-d)*s; s*=0.75; }
  return clamp(1.0-2.5*o,0.0,1.0);
}
bool bsph(vec3 ro, vec3 rd, out float t0, out float t1){
  vec3 oc=ro-C; float b=dot(oc,rd); float c=dot(oc,oc)-4.2; float h=b*b-c;
  if(h<0.0){ t0=0.0; t1=0.0; return false; }
  h=sqrt(h); t0=-b-h; t1=-b+h; return t1>0.0;
}
vec2 march(vec3 ro, vec3 rd, int n){
  float t0, t1;
  if(!bsph(ro,rd,t0,t1)) return vec2(-1.0);
  float t=max(t0,0.0);
  for(int i=0;i<110;i++){
    if(i>=n) break;
    vec2 h=map(ro+rd*t);
    if(h.x<0.0012*t+0.0005) return vec2(t,h.y);
    t+=h.x*0.6;
    if(t>t1) break;
  }
  return vec2(-1.0);
}

vec3 shadeObj(vec3 p, vec3 rd, float m){
  vec3 n=calcN(p);
  vec3 q=p-C;
  float ao=calcAO(p,n);
  vec3 R=reflect(rd,n);
  float fre=pow(1.0-max(dot(-rd,n),0.0),5.0);
  vec3 env=sky(R);
  vec3 L=C-p; float dl=length(L); L/=dl;
  float cl=gCore*max(dot(n,L),0.0)/(1.0+dl*dl*6.0)*6.0;
  float sunSpec=pow(max(dot(R,SUN),0.0),60.0);
  vec3 col;
  if(m<1.5){
    float th=dot(n,-rd);
    vec3 film=0.55+0.45*cos(6.2832*(vec3(0.0,0.33,0.67)+th*1.4+q.y*0.3+uT*0.1));
    col=env*mix(film*0.9,vec3(1.0),fre)*ao;
    col+=film*vec3(1.0,0.6,0.35)*max(dot(n,SUN),0.0)*0.25*ao;
    col+=vec3(1.0,0.6,0.25)*cl*1.5;
    col+=vec3(1.0,0.8,0.6)*sunSpec*3.0;
  } else if(m<2.5){
    col=vec3(2.0,1.3,0.8)*(1.5+gCore)+vec3(1.0,0.4,0.1)*fre*4.0;
  } else {
    col=env*vec3(1.0,0.75,0.4)*(0.6+0.4*fre)+vec3(1.0,0.85,0.6)*pow(max(dot(R,SUN),0.0),80.0)*4.0;
    col+=vec3(1.0,0.6,0.25)*(cl+uImp*2.0);
  }
  return col;
}

vec3 glowAlong(vec3 o, vec3 d, float tmax){
  float tc=clamp(dot(C-o,d),0.0,tmax);
  float dc=length(o+d*tc-C);
  return vec3(1.0,0.5,0.22)*gCore*0.045/(dc*dc+0.015);
}

float waterH(vec2 p){
  return noise(p*1.3+vec2(uT*0.5,uT*0.3))*0.55
       + noise(p*3.1-vec2(uT*0.8,-uT*0.2))*0.3
       + noise(p*7.7+vec2(uT*1.3,uT*0.9))*0.15;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  gTh=mix(0.65,0.04,smoothstep(0.8,2.4,uT))-0.025*smoothstep(8.6,9.5,uT);
  float charge=smoothstep(6.5,8.6,uT);
  gCore=smoothstep(0.9,2.1,uT)*(1.0+(0.12+0.35*charge)*sin(uT*(11.0+8.0*charge)))+0.5*smoothstep(7.6,8.6,uT)+uImp*1.8;

  vec3 ro=uRo;
  vec3 f=normalize(uTa-ro);
  vec3 r=normalize(cross(f,vec3(0.0,1.0,0.0)));
  vec3 u=cross(r,f);
  vec3 rd=normalize(uv.x*r+uv.y*u+1.6*f);

  vec3 col;
  float tH=1e9;
  float tw=1e9;
  if(rd.y<0.0) tw=-ro.y/rd.y;
  vec2 h=march(ro,rd,100);

  if(h.x>0.0 && h.x<tw){
    tH=h.x;
    col=shadeObj(ro+rd*h.x,rd,h.y);
  } else if(rd.y<0.0){
    vec3 p=ro+rd*tw; tH=tw;
    float amp=0.11*exp(-tw*0.045);
    float e=0.04;
    float h0=waterH(p.xz), hx=waterH(p.xz+vec2(e,0.0)), hz=waterH(p.xz+vec2(0.0,e));
    vec3 n=normalize(vec3(-(hx-h0)*amp/e,1.0,-(hz-h0)*amp/e));
    vec3 R=reflect(rd,n); R.y=abs(R.y);
    float fre=0.02+0.98*pow(1.0-max(dot(-rd,n),0.0),5.0);
    vec2 rh=march(p,R,56);
    vec3 refl;
    if(rh.x>0.0){ refl=shadeObj(p+R*rh.x,R,rh.y); refl+=glowAlong(p,R,rh.x); }
    else { refl=sky(R); refl+=glowAlong(p,R,1e9); }
    vec3 Lc=C-p; float dl=length(Lc);
    float pool=gCore*max(dot(n,Lc/dl),0.0)/(1.0+dl*dl*0.8);
    float rr=length(p.xz-C.xz);
    float ring=0.0;
    if(uT>3.3) ring+=exp(-pow((rr-(uT-3.3)*7.5)*1.6,2.0))*exp(-(uT-3.3)*1.1);
    if(uT>8.6) ring+=1.6*exp(-pow((rr-(uT-8.6)*9.0)*1.3,2.0))*exp(-(uT-8.6)*0.9);
    col=vec3(0.005,0.02,0.04)+refl*fre+vec3(1.0,0.5,0.2)*pool*0.35;
    col+=vec3(1.0,0.75,0.45)*pow(max(dot(R,SUN),0.0),350.0)*12.0*(1.0-uNight);
    col+=vec3(1.0,0.6,0.3)*ring*2.0;
  } else {
    col=sky(rd);
  }

  if(tH<1e8) col=mix(col,skyBase(rd),1.0-exp(-tH*0.03));
  col+=glowAlong(ro,rd,tH);

  col*=0.9;
  col=(col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  col=pow(clamp(col,0.0,1.0),vec3(0.4545));
  gl_FragColor=vec4(col,1.0);
}
`;

/* ---------------- POST: bloom, god rays, anamorphic streak, CA, grain ---------------- */
const FS_POST = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform vec2 uSun;
uniform float uSunVis;
uniform float uT;
uniform float uFade;
uniform float uFlash;
varying vec2 vUv;
vec3 br(vec2 uv){ vec3 c=texture2D(uTex,uv).rgb; return max(c-0.7,0.0)*3.3; }
void main(){
  vec2 uv=vUv; vec2 d=uv-0.5; float asp=uRes.x/uRes.y;
  float ca=0.0035+uFlash*0.02;
  vec3 col=vec3(texture2D(uTex,uv-d*ca).r,texture2D(uTex,uv).g,texture2D(uTex,uv+d*ca).b);

  vec3 bl=vec3(0.0);
  for(int i=0;i<16;i++){
    float fi=float(i); float a=fi*2.39996; float r=sqrt(fi+0.5)*0.016;
    bl+=br(uv+vec2(cos(a)/asp,sin(a))*r);
  }
  col+=bl/16.0*vec3(1.0,0.75,0.55)*0.8;

  vec3 st=vec3(0.0);
  for(int i=-6;i<=6;i++){ float fi=float(i); st+=br(uv+vec2(fi*0.03,0.0))*(1.0-abs(fi)/7.0); }
  col+=st/13.0*vec3(0.35,0.55,1.0)*0.6;

  if(uSunVis>0.001){
    vec2 dir=(uSun-uv)*(0.85/40.0); vec2 sp=uv; float w=1.0; vec3 g=vec3(0.0);
    for(int i=0;i<40;i++){ sp+=dir; g+=br(sp)*w; w*=0.965; }
    col+=g/40.0*vec3(1.0,0.68,0.38)*1.6*uSunVis;
  }

  col*=mix(1.0,0.35,smoothstep(0.35,1.0,length(d)*1.4));
  float n=fract(sin(dot(uv*uRes+uT*60.0,vec2(12.9898,78.233)))*43758.5453);
  col+=(n-0.5)*0.035;
  col=col*uFade+vec3(uFlash);
  gl_FragColor=vec4(col,1.0);
}
`;



/* ---------------- GAME SHADERS ---------------- */
const NOISE = `
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float fbm(vec2 p){
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++){ v+=a*noise(p); p=rot(0.5)*p*2.03+vec2(1.7,9.2); a*=0.5; }
  return v;
}
`;

const FS_BG = `
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform float uPsi;
uniform float uWin;
` + NOISE + `
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
  vec2 q=uv+vec2(uPsi*0.25,0.0);

let bus = null;
function getBus(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  ac = ac || new AC();
  if(ac.state === 'suspended') ac.resume();
  if(!bus){
    const m = ac.createGain(); m.gain.value = 0.6; m.connect(ac.destination);
    const rv = ac.createConvolver(); rv.buffer = impulse(ac, 2.2);
    const rg = ac.createGain(); rg.gain.value = 0.35; rv.connect(rg); rg.connect(m);
    bus = { m, rv, nb: noiseBuf(ac, 1) };
  }

}
function tone(f, vol, len, type, delay, toRev, fEnd){

  const o = ac.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if(fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + len);

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(b.m); if(toRev !== false) g.connect(b.rv);

  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;

  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + len * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  s.connect(f); f.connect(g); g.connect(b.m); g.connect(b.rv);

/* ---------- puzzle game ---------- */
const HUB_R = 0.12, FRAME_R = 1.085, LIP_R = 1.11, GAP = 0.0016, LEVELS = 20, FOV = 35 * Math.PI / 180;
const TAU = Math.PI * 2;
const wrap = a => a - TAU * Math.round(a / TAU);
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const G = { mode:'boot', level:1, maxLevel:1, n:5, w:0.176, rings:[], sel:-1, tol:0.2, seed:[0,0,0,0,0,0,0,0],
  psi:0, psiAnim:null, won:false, winT:0, cap:15, ppu:150, D:4, halfH:1, fadeT0:0, lastTap:{i:-1,t:0}, cam:null };
try {
  G.maxLevel = Math.max(1, Math.min(LEVELS, parseInt(localStorage.getItem('helios-max'), 10) || 1));
  G.level = G.maxLevel;
} catch(e) {}

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function viewMetrics(){
  const W = innerWidth, H = innerHeight;
  const coarse = matchMedia('(pointer:coarse)').matches;
  const span = 2 * LIP_R + 0.04;
  G.ppu = Math.max(40, Math.min((W - 16) / span, (H - 170) / span));
  G.halfH = (H / 2) / G.ppu;
  G.D = G.halfH / Math.tan(FOV / 2);
  const minW = coarse ? 9 : 7;
  G.cap = Math.max(5, Math.min(100, Math.floor(((1 - HUB_R) * G.ppu / minW) / 5) * 5));
}

function startLevel(L){
  G.level = L;
  G.n = Math.min(5 * L, G.cap);
  G.w = (1 - HUB_R) / G.n;
  G.tol = Math.max(4, 12 - (L - 1) * 0.45) * Math.PI / 180;
  const rnd = mulberry32(L * 7919 + 13);
  G.seed = Array.from({length: 8}, () => rnd());
  G.rings = [];
  for(let i = 0; i < G.n; i++){
    let th; do { th = (Math.random() * 2 - 1) * Math.PI; } while(Math.abs(th) < 0.6);
    G.rings.push({ th, d: Math.random() < 0.5 ? 1 : -1, axis: Math.random() < 0.5 ? 'h' : 'v', locked:false, flip:null, snap:null, pulseT:-1e9 });
  }
  G.sel = -1; G.won = false; G.winT = 0;
  hudUpdate();
}

/* 3x3 row-major helpers */
function mul3(a, b){ const o = new Array(9); for(let r = 0; r < 3; r++) for(let c = 0; c < 3; c++) o[r*3+c] = a[r*3]*b[c] + a[r*3+1]*b[3+c] + a[r*3+2]*b[6+c]; return o; }
function rz(a){ const c = Math.cos(a), s = Math.sin(a); return [c,-s,0, s,c,0, 0,0,1]; }
function ry(a){ const c = Math.cos(a), s = Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; }
function rx(a){ const c = Math.cos(a), s = Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; }
const I3 = [1,0,0, 0,1,0, 0,0,1];
const colMajor = m => new Float32Array([m[0],m[3],m[6], m[1],m[4],m[7], m[2],m[5],m[8]]);

function ringMatrix(rg, now){
  let M = mul3(rz(rg.th), rg.d < 0 ? ry(Math.PI) : I3);
  if(rg.flip){
    const s = ease(Math.min(1, (now - rg.flip.t0) / rg.flip.dur));
    M = mul3(rg.axis === 'h' ? ry(Math.PI * s) : rx(Math.PI * s), M);
  }
  return M;
}

function gameCam(now){
  const t = now / 1000;
  const el = 0.035 * Math.sin(t * 0.5);
  const az = G.psi + 0.03 * Math.sin(t * 0.37);
  const D = G.D;
  const eye = [Math.sin(az) * Math.cos(el) * D, Math.sin(el) * D, Math.cos(az) * Math.cos(el) * D];
  const f = norm([-eye[0], -eye[1], -eye[2]]);
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  const asp = innerWidth / innerHeight;
  const ft = 1 / Math.tan(FOV / 2), n = Math.max(0.1, D - 1.6), fa = D + 1.6;
  const P = [ft/asp,0,0,0, 0,ft,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0];
  const V = [r[0],u[0],-f[0],0, r[1],u[1],-f[1],0, r[2],u[2],-f[2],0, -dot(r,eye),-dot(u,eye),dot(f,eye),1];
  const VP = new Array(16);
  for(let c = 0; c < 4; c++) for(let rr = 0; rr < 4; rr++){ let s = 0; for(let k = 0; k < 4; k++) s += P[k*4+rr] * V[c*4+k]; VP[c*4+rr] = s; }
  const L = norm([r[0]*0.35 + u[0]*0.55 - f[0]*0.75, r[1]*0.35 + u[1]*0.55 - f[1]*0.75, r[2]*0.35 + u[2]*0.55 - f[2]*0.75]);
  return { eye, f, r, u, asp, VP: new Float32Array(VP), L };
}

function pickWorld(cx, cy){
  const c = G.cam; if(!c) return null;
  const nx = cx / innerWidth * 2 - 1, ny = 1 - cy / innerHeight * 2;
  const th = Math.tan(FOV / 2);
  const d = norm([c.f[0] + c.r[0]*nx*th*c.asp + c.u[0]*ny*th, c.f[1] + c.r[1]*nx*th*c.asp + c.u[1]*ny*th, c.f[2] + c.r[2]*nx*th*c.asp + c.u[2]*ny*th]);
  if(Math.abs(d[2]) < 1e-4) return null;
  const t = -c.eye[2] / d[2];
  if(t < 0) return null;
  return [c.eye[0] + d[0]*t, c.eye[1] + d[1]*t];
}
function ringAt(p){
  if(!p) return -1;
  const r = Math.hypot(p[0], p[1]);
  if(r < HUB_R || r > 1) return -1;
  return Math.min(G.n - 1, Math.floor((r - HUB_R) / G.w));
}
const interactive = () => G.mode === 'game' && !G.won && !G.psiAnim && Math.abs(Math.sin(G.psi)) < 0.12;
const isCorrect = i => i < 0 || i >= G.n || (G.rings[i].d === 1 && !G.rings[i].flip && !G.rings[i].snap && Math.abs(wrap(G.rings[i].th)) < 1e-4);

function flipRing(i){
  const rg = G.rings[i];
  if(!rg || rg.locked || rg.flip || rg.snap) return;
  rg.flip = { t0: performance.now(), dur: 560 };
  sfx.flip();
}
function trySnap(i){
  const rg = G.rings[i];
  rg.th = wrap(rg.th);
  if(rg.d === 1 && Math.abs(rg.th) < G.tol && Math.abs(rg.th) > 1e-6){
    rg.snap = { from: rg.th, t0: performance.now() };
    sfx.snap();
  } else evaluateLocks();
}
function evaluateLocks(){
  const fresh = [];
  for(let i = 0; i < G.n; i++){
    const rg = G.rings[i];
    if(!rg.locked && isCorrect(i) && (isCorrect(i - 1) || isCorrect(i + 1))){ rg.locked = true; rg.pulseT = performance.now(); fresh.push(i); }
  }
  if(fresh.length){
    sfx.lock();
    if(fresh.includes(G.sel)) G.sel = -1;
  }
  hudUpdate();
  if(G.rings.every(r => r.locked)) win();
}
function win(){
  if(G.won) return;
  G.won = true; G.winT = performance.now(); G.sel = -1;
  sfx.win();
  G.psiAnim = { from: G.psi, to: G.psi + Math.PI, t0: G.winT + 600, dur: 1600, next: { delta: Math.PI, delay: 3200, dur: 1600 } };
  const next = Math.min(LEVELS, G.level + 1);
  if(next > G.maxLevel){ G.maxLevel = next; try { localStorage.setItem('helios-max', String(next)); } catch(e) {} }
  hudUpdate();
  setTimeout(() => {
    if(G.mode !== 'game' || !G.won) return;
    const last = G.level >= LEVELS;
    $('wTag').textContent = 'LEVEL ' + G.level + ' COMPLETE';
    $('wTitle').textContent = last ? 'ALL GATES OPEN' : 'GATE OPEN';
    $('wNext').classList.toggle('hide', last);
    winEl.classList.remove('hide');
  }, 7400);
}
function turnAround(){
  if(G.psiAnim || G.won) return;
  const base = Math.round(G.psi / Math.PI) * Math.PI;
  G.psiAnim = { from: G.psi, to: base + Math.PI, t0: performance.now(), dur: 900 };
  sfx.turn();
}

function updateGame(now, dt){
  if(G.mode === 'menu' && !G.psiAnim) G.psi += dt * 0.25;
  if(G.psiAnim){
    const a = G.psiAnim, x = (now - a.t0) / a.dur;
    if(x >= 1){ G.psi = Math.atan2(Math.sin(a.to), Math.cos(a.to)); G.psiAnim = a.next ? { from: G.psi, to: G.psi + a.next.delta, t0: now + a.next.delay, dur: a.next.dur } : null; if(a.next) sfx.turn(); }
    else if(x > 0) G.psi = a.from + (a.to - a.from) * ease(x);
  }
  for(let i = 0; i < G.n; i++){
    const rg = G.rings[i];
    if(rg.flip && now - rg.flip.t0 >= rg.flip.dur){
      rg.th = wrap(rg.axis === 'h' ? -rg.th : Math.PI - rg.th);
      rg.d = -rg.d; rg.flip = null;
      trySnap(i);
    }
    if(rg.snap){
      const x = (now - rg.snap.t0) / 160;
      if(x >= 1){ rg.th = 0; rg.snap = null; evaluateLocks(); }
      else rg.th = rg.snap.from * (1 - ease(x));
    }
  }
}

function drawPiece(r0, r1, thick, type, M, lock, sel, pulse, axis){
  gl.uniform2f(ur.uRad, r0, r1);
  gl.uniform1f(ur.uThick, thick);
  gl.uniform1f(ur.uType, type);
  gl.uniformMatrix3fv(ur.uRot, false, colMajor(M));
  gl.uniform1f(ur.uLock, lock);
  gl.uniform1f(ur.uSel, sel);
  gl.uniform1f(ur.uPulse, pulse);
  gl.uniform2f(ur.uAxis, axis[0], axis[1]);
  gl.drawArrays(gl.TRIANGLES, 0, ringVerts);
}

function renderGame(now){
  const t = (now / 1000) % 1000;
  const cam = G.cam = gameCam(now);
  const winK = G.won ? Math.min(1, (now - G.winT) / 800) : 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, gFbo);
  gl.viewport(0, 0, gW, gH);
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  bindTri();
  gl.useProgram(pBg);
  gl.uniform2f(ub.uRes, gW, gH);
  gl.uniform1f(ub.uT, t);
  gl.uniform1f(ub.uPsi, G.psi);
  gl.uniform1f(ub.uWin, winK);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(pRing);
  bindRing();
  gl.uniformMatrix4fv(ur.uVP, false, cam.VP);
  gl.uniform4f(ur.uS1, G.seed[0], G.seed[1], G.seed[2], G.seed[3]);
  gl.uniform4f(ur.uS2, G.seed[4], G.seed[5], G.seed[6], G.seed[7]);
  gl.uniform1f(ur.uT, t);
  gl.uniform1f(ur.uWin, winK);
  gl.uniform3fv(ur.uCam, cam.eye);
  gl.uniform3fv(ur.uL, cam.L);
  const none = [0, 1];
  drawPiece(0, HUB_R - GAP, 0.014, 1, I3, 1, 0, 0, none);
  drawPiece(1 + GAP, FRAME_R, 0.02, 2, I3, 1, 0, 0, none);
  drawPiece(FRAME_R, LIP_R, 0.035, 3, I3, 0, 0, 0, none);
  for(let i = 0; i < G.n; i++){
    const rg = G.rings[i];
    const r0 = HUB_R + i * G.w + GAP, r1 = HUB_R + (i + 1) * G.w - GAP;
    let pulse = Math.max(0, 1 - (now - rg.pulseT) / 700);
    if(G.won) pulse = Math.max(pulse, 1 - Math.abs((now - G.winT) / 1000 * 3 - i / G.n * 2.5) * 1.5);
    drawPiece(r0, r1, 0.01, 0, ringMatrix(rg, now), rg.locked ? 1 : 0, i === G.sel ? 1 : 0, pulse, rg.axis === 'h' ? [0, 1] : [1, 0]);
  }
  gl.disable(gl.DEPTH_TEST);

  const fade = Math.min(1, (now - G.fadeT0) / 900);
  const flash = G.won ? Math.max(0, 0.45 * (1 - (now - G.winT) / 450)) : 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cv.width, cv.height);
  bindTri();
  gl.useProgram(pPost);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, gTex);
  gl.uniform1i(up.uTex, 0);
  gl.uniform2f(up.uRes, cv.width, cv.height);
  gl.uniform2f(up.uSun, 0.5, 0.5);
  gl.uniform1f(up.uSunVis, 0);
  gl.uniform1f(up.uT, t);
  gl.uniform1f(up.uFade, fade);
  gl.uniform1f(up.uFlash, flash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- input ---------- */
let drag = null, tickAcc = 0;
cv.addEventListener('pointerdown', e => {
  if(G.mode !== 'game' || G.won) return;
  cv.setPointerCapture(e.pointerId);
  getBus();
  const p = interactive() ? pickWorld(e.clientX, e.clientY) : null;
  const i = ringAt(p);
  if(i >= 0){
    const rg = G.rings[i];
    if(rg.locked){ rg.pulseT = performance.now(); sfx.deny(); drag = null; return; }
    if(G.sel !== i){ G.sel = i; sfx.select(); hudUpdate(); }
    drag = { type:'ring', i, last: Math.atan2(p[1], p[0]), x: e.clientX, y: e.clientY, moved:false };
  } else {
    drag = { type:'orbit', lastX: e.clientX, x: e.clientX, moved:false };
  }
});
cv.addEventListener('pointermove', e => {
  if(!drag) return;
  if(drag.type === 'ring'){
    const rg = G.rings[drag.i];
    if(rg.flip || rg.snap || rg.locked) return;
    const p = pickWorld(e.clientX, e.clientY); if(!p) return;
    const a = Math.atan2(p[1], p[0]);
    const d = wrap(a - drag.last); drag.last = a;
    if(!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
    if(drag.moved){
      rg.th += d;
      tickAcc += Math.abs(d);
      if(tickAcc > 0.26){ tickAcc = 0; sfx.tick(); }
    }
  } else {
    const dx = e.clientX - drag.lastX; drag.lastX = e.clientX;
    if(Math.abs(e.clientX - drag.x) > 6) drag.moved = true;
    if(drag.moved && !G.psiAnim) G.psi += dx * 0.009;
  }
});
function endDrag(){
  if(!drag) return;
  if(drag.type === 'ring'){
    if(!drag.moved){
      const now = performance.now();
      if(G.lastTap.i === drag.i && now - G.lastTap.t < 340){ flipRing(drag.i); G.lastTap = {i:-1, t:0}; }
      else G.lastTap = { i: drag.i, t: now };
    } else trySnap(drag.i);
  } else if(drag.moved && !G.psiAnim){
    const to = Math.round(G.psi / Math.PI) * Math.PI;
    G.psiAnim = { from: G.psi, to, t0: performance.now(), dur: 450 };
  }
  drag = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

  fb.innerHTML = (sel && sel.axis === 'v' ? '⇅' : '⇆') + ' FLIP';
  $('hint').classList.toggle('hide', G.level > 2);
  $('mLvl').textContent = 'LEVEL ' + G.level + ' · ' + G.n + ' RINGS';
  $('mPrev').disabled = G.level <= 1;
  $('mNext').disabled = G.level >= G.maxLevel;
}

function playIntro(){
  [ui, menuEl, hud, winEl].forEach(el => el.classList.add('hide'));
  titleEl.className = ''; titleStage = 0;
  subEl.textContent = 'real-time · raymarched · one file';
  try { soundtrack(); } catch(e) {}
  introStart = performance.now() + 30;
  G.mode = 'intro';
  skipBtn.classList.remove('hide');
}
function introFrame(now){
  const t = Math.min(DURATION, Math.max(0, (now - introStart) / 1000));
  const fade = ss(0, 0.5, t) * (1 - ss(9.4, 10, t));
  let flash = 0;
  if(t > 3.3 && t < 3.6) flash += Math.pow(1 - (t - 3.3) / 0.3, 2) * 0.7;
  if(t > 8.6 && t < 9.1) flash += Math.pow(1 - (t - 8.6) / 0.5, 2) * 1.0;
  bindTri();
  draw(t, fade, flash);
  if(titleStage === 0 && t > 3.55){ titleEl.className = 'on'; titleStage = 1; }
  if(titleStage === 1 && t > 4.9){ titleEl.className = 'on out'; titleStage = 2; }
  if(titleStage === 2 && t > 6.0){ titleEl.className = ''; subEl.textContent = 'ten seconds · zero dependencies'; titleStage = 3; }
  if(titleStage === 3 && t > 8.95){ titleEl.className = 'on'; titleStage = 4; }
  if(titleStage === 4 && t > 9.45){ titleEl.className = 'on out'; titleStage = 5; }
  if(t >= DURATION) endIntro();
}
function endIntro(){
  skipBtn.classList.add('hide');
  titleEl.className = '';
  enterMenu();
}
function skipIntro(){
  if(introMaster && ac){
    introMaster.gain.cancelScheduledValues(ac.currentTime);
    introMaster.gain.setTargetAtTime(0.0001, ac.currentTime, 0.08);
  }
  endIntro();
}
function enterMenu(){
  [ui, hud, winEl].forEach(el => el.classList.add('hide'));
  if(G.mode !== 'game' || G.won) startLevel(G.won ? Math.min(LEVELS, G.level + 1) : G.level);
  G.mode = 'menu';
  G.fadeT0 = performance.now();
  G.psiAnim = null;
  menuEl.classList.remove('hide');
  hudUpdate();
}
function startGame(){
  menuEl.classList.add('hide');
  winEl.classList.add('hide');
  hud.classList.remove('hide');
  G.mode = 'game';
  G.psiAnim = { from: G.psi, to: Math.round(G.psi / TAU) * TAU, t0: performance.now(), dur: 900 };
  getBus();
  hudUpdate();
}

$('play').addEventListener('click', () => { getBus(); playIntro(); });
$('skipStart').addEventListener('click', () => { getBus(); ui.classList.add('hide'); G.fadeT0 = performance.now(); enterMenu(); });
skipBtn.addEventListener('click', skipIntro);
$('mStart').addEventListener('click', startGame);
$('mIntro').addEventListener('click', playIntro);
$('mPrev').addEventListener('click', () => { if(G.level > 1){ startLevel(G.level - 1); sfx.select(); } });
$('mNext').addEventListener('click', () => { if(G.level < G.maxLevel){ startLevel(G.level + 1); sfx.select(); } });
$('bTurn').addEventListener('click', turnAround);
$('bFlip').addEventListener('click', () => { if(G.sel >= 0) flipRing(G.sel); });
$('bMenu').addEventListener('click', enterMenuKeep);
$('wNext').addEventListener('click', () => { startLevel(Math.min(LEVELS, G.level + 1)); startGame(); });
$('wMenu').addEventListener('click', () => { startLevel(Math.min(LEVELS, G.level + 1)); enterMenuKeep(); });

function enterMenuKeep(){
  [ui, hud, winEl].forEach(el => el.classList.add('hide'));
  G.mode = 'menu';
  G.psiAnim = null;
  menuEl.classList.remove('hide');
  hudUpdate();
}

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  if(!pScene) return;
  if(G.mode === 'intro') introFrame(now);
  else if(G.mode === 'menu' || G.mode === 'game'){ updateGame(now, dt); renderGame(now); }
}

try {
  if(!gl) throw new Error('WebGL is not available on this device.');
  triBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, triBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const S = 256, v = [];
  for(let k = 0; k < 4; k++) for(let i = 0; i < S; i++){
    const s0 = i / S, s1 = (i + 1) / S;
    v.push(s0,0,k, s1,0,k, s1,1,k, s0,0,k, s1,1,k, s0,1,k);
  }
  ringBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ringBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
  ringVerts = v.length / 3;
  gl.enableVertexAttribArray(0);
  pScene = program(VS, FS_SCENE);
  pPost = program(VS, FS_POST);
  pBg = program(VS, FS_BG);
  pRing = program(VS_RING, FS_RING);
  us = uniforms(pScene, ['uRes', 'uT', 'uImp', 'uRo', 'uTa', 'uSun', 'uNight']);
  up = uniforms(pPost, ['uTex', 'uRes', 'uSun', 'uSunVis', 'uT', 'uFade', 'uFlash']);
  ub = uniforms(pBg, ['uRes', 'uT', 'uPsi', 'uWin']);
  ur = uniforms(pRing, ['uVP','uRot','uRad','uThick','uS1','uS2','uT','uType','uLock','uSel','uPulse','uWin','uAxis','uCam','uL']);
  resize();
  startLevel(G.level);
  bindTri();
  draw(POSTER_T, 1, 0);
} catch(e) {
  errEl.textContent = String(e.message || e);
  $('play').disabled = true;
}
addEventListener('resize', () => {
  if(!pScene) return;
  resize();
  if(G.mode === 'boot'){ bindTri(); draw(POSTER_T, 1, 0); }
});
requestAnimationFrame(loop);
</script>
